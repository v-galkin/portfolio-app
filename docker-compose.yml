name: portfolio
services:
  portfolio-db:
    container_name: portfolio-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - portfolio-network
  portfolio-backend:
    container_name: portfolio-backend
    build: ./backend
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://portfolio-db:5432/portfolio
      SPRING_DATASOURCE_USERNAME: portfolio_user
      SPRING_DATASOURCE_PASSWORD: portfolio_pass
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      portfolio-db:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - portfolio-network
  portfolio-frontend:
    container_name: portfolio-frontend
    build: ./frontend
    volumes:
      - dist:/dist
    depends_on:
      - portfolio-backend
    restart: no
    networks:
      - portfolio-network
volumes:
  postgres_data:
  dist:
networks:
  portfolio-network:
    external: true
    name: portfolio-network