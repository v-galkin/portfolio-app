spring.application.name=portfolio

# Local dev: values can come from backend/.env (git-ignored), e.g. ADMIN_USERNAME and ADMIN_PASSWORD (required).
# In Docker the file doesn't exist and the environment variables from docker-compose are used.
spring.config.import=optional:file:.env[.properties]

server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/portfolio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:portfolio_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:portfolio_pass}

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only checks that
# the entities match it and never changes the database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Databases created before Flyway (by ddl-auto=update + data.sql) already contain V1 (schema)
# and V2 (seed), so they are recorded as baseline V2 instead of re-running them.
# Empty databases are not baselined and run all migrations normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.baseline-description=Existing schema and seed from before Flyway

# No defaults: the app must not start with well-known credentials
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

# Admin session cookie (JSESSIONID): not readable by JavaScript, never sent on cross-site
# requests, expires after 2 hours of inactivity. Tomcat marks it Secure automatically when the
# request came in over HTTPS (nginx must send X-Forwarded-Proto, see server.forward-headers-strategy).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=2h

# Brute-force protection: block an IP for block-minutes after max-attempts failed logins
security.login.max-attempts=5
security.login.block-minutes=15

# Behind nginx, take the client IP from X-Forwarded-For. Tomcat only trusts the header
# from private-network proxies (e.g. the Docker network), so clients can't spoof it.
server.forward-headers-strategy=native

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Health check for Docker: only /actuator/health is exposed over HTTP, and it returns just
# {"status":"UP"} or {"status":"DOWN"} (including the database check), with no details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
