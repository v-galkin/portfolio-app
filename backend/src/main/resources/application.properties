spring.application.name=portfolio

# Environment:
# - local dev: backend/.env, ignored by git; ADMIN_USERNAME and ADMIN_PASSWORD are required
# - Docker: variables from docker-compose
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/portfolio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:portfolio_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:portfolio_pass}

# Schema is owned by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate

# Flyway baseline:
# - databases created before Flyway are recorded as V2 instead of re-running V1 and V2
# - empty databases run all migrations
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.baseline-description=Existing schema and seed from before Flyway

# No defaults: the app must not start with well-known credentials
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

# Admin session cookie:
# - Tomcat adds Secure for HTTPS requests
# - needs X-Forwarded-Proto from nginx
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=2h

# Brute-force protection: block an IP for block-minutes after max-attempts failed logins
security.login.max-attempts=5
security.login.block-minutes=15

# Client IP behind nginx:
# - taken from X-Forwarded-For
# - only trusted from private-network proxies, so clients can't spoof it
server.forward-headers-strategy=native

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Docker health check:
# - only /actuator/health is exposed
# - returns UP or DOWN, with no details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
